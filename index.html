<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="description" content="Aplikasi manajemen tugas yang mudah dan powerful untuk mencatat semua tugas Anda">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Taskly">
    <title>Taskly - Catat Tugasmu</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons for iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon-192.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon-192.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="logo-container">
            <i class="fas fa-check-circle"></i>
            <h1>Taskly</h1>
            <p>Catat Tugasmu</p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="app-container" style="display: none;">
        <!-- Header -->
        <header class="header">
            <button class="btn-icon" id="back-btn"><i class="fas fa-chevron-left"></i></button>
            <h1 class="header-title" id="header-title">Tugas Saya</h1>
            <div class="header-actions">
                <button class="btn-icon" id="search-btn"><i class="fas fa-search"></i></button>
                <button class="btn-icon" id="more-btn"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </header>

        <!-- Content Area -->
        <main class="content" id="main-content"></main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-page="home">
                <i class="fas fa-home"></i>
                <span>Beranda</span>
            </button>
            <button class="nav-item" data-page="calendar">
                <i class="far fa-calendar"></i>
                <span>Kalender</span>
            </button>
            <button class="nav-item" data-page="add">
                <i class="fas fa-plus-circle"></i>
                <span>Tambah</span>
            </button>
            <button class="nav-item" data-page="stats">
                <i class="fas fa-chart-pie"></i>
                <span>Statistik</span>
            </button>
            <button class="nav-item" data-page="profile">
                <i class="far fa-user"></i>
                <span>Profil</span>
            </button>
        </nav>

        <!-- FAB Button -->
        <button class="fab" id="fab-btn">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <!-- Modals will be injected here -->
    <div id="modal-container"></div>

    <!-- Install Prompt -->
    <div id="install-prompt" class="install-prompt" style="display: none;">
        <div class="install-content">
            <i class="fas fa-download"></i>
            <div class="install-text">
                <h3>Install Taskly</h3>
                <p>Tambahkan ke home screen untuk akses cepat!</p>
            </div>
            <button class="btn-install" id="install-btn">Install</button>
            <button class="btn-close-install" id="close-install">✕</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="sw-register.js"></script>
</body>
</html>
